<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Agent Activity Dock</title>
<style>
  html, body { margin:0; background:transparent; overflow:hidden; font-family:'DejaVu Sans', sans-serif; }
  #panel {
    width:400px; box-sizing:border-box; min-height:330px; max-height:520px;
    background:rgba(15,23,42,.97); border:1px solid #334155; border-radius:14px;
    padding:14px 16px; color:#e2e8f0; overflow:hidden;
  }
  h1 { margin:0 0 10px; font-size:15px; color:#f8fafc; }
  .row {
    display:flex; align-items:center; gap:8px;
    padding:7px 6px; border-radius:8px; cursor:pointer; font-size:12px;
  }
  .row:hover { background:#1e293b; }
  .dot { width:8px; height:8px; border-radius:50%; flex:none; }
  .task { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta { color:#64748b; margin-left:auto; flex:none; }
  .empty, .more { color:#64748b; padding:8px 6px; }
</style>
</head>
<body>
  <div id="panel">
    <h1>Agent Activity Dock</h1>
    <div id="rows"></div>
  </div>
<script>
  const rows = document.getElementById('rows');
  window.dock.onSnapshot((message) => render(message.snapshot || {}));
  document.body.addEventListener('click', (event) => {
    if (!event.target.closest('.row')) window.dock.closeList();
  });
  function esc(value) {
    return String(value).replace(/[&<>"']/g, (ch) => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[ch]);
  }
  function render(snapshot) {
    const tasks = snapshot.tasks || [];
    rows.innerHTML = '';
    if (!tasks.length) {
      rows.innerHTML = '<div class="empty">No tracked tasks yet.</div>';
      return;
    }
    const maxRows = 12;
    tasks.slice(0, maxRows).forEach((task) => {
      const row = document.createElement('div');
      row.className = 'row';
      let color = '#94a3b8';
      if (task.working) color = '#22c55e';
      else if (task.last_action === 'waiting') color = '#fbbf24';
      else if (task.last_action === 'error') color = '#f87171';
      const mark = task.needs_attention ? '!' : ' ';
      const state = task.working ? 'working' : task.last_action;
      row.innerHTML = `<div class="dot" style="background:${color}"></div>
        <div class="task">${mark} ${esc(task.task_id)}</div>
        <div class="meta">${esc(task.source)} · ${esc(state)}</div>`;
      row.addEventListener('click', () => window.dock.ackTask(task.task_id));
      rows.appendChild(row);
    });
    if (tasks.length > maxRows) {
      const more = document.createElement('div');
      more.className = 'more';
      more.textContent = `... ${tasks.length - maxRows} more`;
      rows.appendChild(more);
    }
  }
</script>
</body>
</html>
