[workspace]
members = [
    "crates/dock-core",
    "crates/dock-ipc",
    "crates/dock-cli",
    "crates/dock-service",
    "crates/dock-adapters",
    "crates/dock-connect",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
interprocess = "2.4.3"
