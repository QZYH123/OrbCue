name: Agent Activity Dock CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --exclude agent-activity-dock
      - run: cargo check -p agent-activity-dock

  windows-rust:
    name: Windows Rust and Tauri checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --exclude agent-activity-dock
      - run: cargo check --workspace --exclude agent-activity-dock --target x86_64-pc-windows-msvc
      - run: npm ci --prefix frontend
      - run: npm run tauri -- build --debug --no-bundle

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run check
      - run: npm run build

  package-linux:
    name: Linux bundles
    runs-on: ubuntu-latest
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Tauri bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2
      - run: npm ci --prefix frontend
      - run: npm run tauri -- build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: agent-activity-dock-linux-bundles
          path: target/release/bundle/
          if-no-files-found: error

  linux-cli:
    name: Linux musl CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - run: cargo build -p agent-activity-dock-cli --release --target x86_64-unknown-linux-musl
      - name: Stage dock-wsl artifact
        run: |
          mkdir -p src-tauri/resources
          cp target/x86_64-unknown-linux-musl/release/dock src-tauri/resources/dock-wsl
      - uses: actions/upload-artifact@v4
        with:
          name: dock-wsl
          path: src-tauri/resources/dock-wsl
          if-no-files-found: error

  package-windows:
    name: Windows installer
    runs-on: windows-latest
    needs: [rust, frontend, linux-cli]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: dock-wsl
          path: src-tauri/resources
      - run: npm ci --prefix frontend
      - run: npm run tauri -- build --bundles nsis
        env:
          AGENT_ACTIVITY_DOCK_SKIP_WSL_DOCK_BUILD: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-activity-dock-windows-nsis
          path: target/release/bundle/nsis/
          if-no-files-found: error
