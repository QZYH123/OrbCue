<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>OrbCue demo</title>
  <style>
    :root {
      --stage-w: 480px;
      --stage-h: 448px;
      --bg: #121416;
      --text: #eceef1;
      --muted: #8d939c;
      --faint: #6a717a;
      --line: rgba(255, 255, 255, .08);
      --working: #5ecf8f;
      --wait: #e0a257;
      --card: rgba(255, 255, 255, .04);
      font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: var(--stage-w);
      height: var(--stage-h);
      overflow: hidden;
      background: #2b2e33;
      color: var(--text);
    }
    .stage {
      width: var(--stage-w);
      height: var(--stage-h);
      display: grid;
      place-items: center;
    }
    body[data-scene="panel"] .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
    }

    .orb-slot { width: 157px; height: 157px; display: grid; place-items: center; }
    .orb-wrap { width: 56px; height: 56px; transform: scale(2.8); }
    body[data-scene="panel"] .orb-slot { width: 101px; height: 101px; flex: 0 0 auto; }
    body[data-scene="panel"] .orb-wrap { transform: scale(1.8); }

    .ball-shell {
      position: relative;
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      clip-path: circle(28px at 28px 28px);
    }
    .ball {
      position: relative;
      width: 52px;
      height: 52px;
      padding: 0;
      overflow: hidden;
      border: 1.5px solid #84919e;
      border-radius: 50%;
      color: #fff;
      background:
        radial-gradient(circle at 32% 26%, rgba(255, 255, 255, .2), transparent 38%),
        radial-gradient(circle at 50% 112%, rgba(0, 0, 0, .42), transparent 54%),
        linear-gradient(180deg, #2c323a 0%, #12151a 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .18),
        inset 0 0 0 1px rgba(255, 255, 255, .04);
      --ring: #84919e;
      --ratio: .4;
    }
    .ball.working {
      border-color: var(--working);
      --ring: var(--working);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .18),
        inset 0 0 0 1.5px rgba(94, 207, 143, .4),
        inset 0 0 14px rgba(94, 207, 143, .1);
    }
    .ball.wait {
      border-color: var(--wait);
      --ring: var(--wait);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .18),
        inset 0 0 0 1.5px rgba(224, 162, 87, .5),
        inset 0 0 14px rgba(224, 162, 87, .1);
    }
    .ball-ring {
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      background: conic-gradient(
        from -90deg,
        var(--ring) calc(var(--ratio) * 360deg),
        rgba(255, 255, 255, .1) 0
      );
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px));
              mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px));
    }
    .ball-core {
      position: absolute;
      inset: 13px;
      border-radius: 50%;
      background: radial-gradient(circle at 42% 32%, rgba(255, 255, 255, .12), transparent 64%);
    }
    .count {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .45);
    }
    .count-work { font-size: 15px; font-weight: 700; letter-spacing: -.05em; }
    .count-total {
      min-width: 1.15em;
      padding-top: 2px;
      border-top: 1px solid rgba(255, 255, 255, .18);
      color: rgba(255, 255, 255, .55);
      font-size: 9px;
      font-weight: 650;
      text-align: center;
    }
    .badge {
      position: absolute;
      right: 7px;
      top: 7px;
      z-index: 2;
      width: 12px;
      height: 12px;
      display: none;
      place-items: center;
      border: 1.5px solid #121416;
      border-radius: 99px;
      color: #2a1b07;
      background: var(--wait);
      font-size: 9.5px;
      font-weight: 800;
      line-height: 1;
    }
    body[data-scene="wait"] .badge,
    body[data-scene="panel"] .badge { display: grid; }

    .panel {
      display: none;
      flex-direction: column;
      width: 300px;
      height: 400px;
      padding: 12px 12px 6px;
      overflow: hidden;
      background:
        radial-gradient(100% 50% at 8% -12%, rgba(224, 162, 87, .1), transparent 44%),
        linear-gradient(180deg, #1c1f24 0%, var(--bg) 100%);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06);
    }
    body[data-scene="panel"] .panel { display: flex; }
    .panel > * { flex: 0 0 auto; min-width: 0; }
    .panel-body {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      min-height: 44px;
    }
    .hero-count { display: flex; align-items: baseline; gap: 8px; }
    .hero-work {
      color: var(--wait);
      font-size: 32px;
      font-weight: 650;
      line-height: .86;
      letter-spacing: -.05em;
      font-variant-numeric: tabular-nums;
    }
    .hero-rest { display: grid; gap: 2px; }
    .hero-track { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
    .hero-meta { color: var(--muted); font-size: 11px; letter-spacing: .08em; }
    .icon-button {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 99px;
      color: var(--muted);
      background: rgba(255, 255, 255, .04);
      font-size: 16px;
      line-height: 28px;
      text-align: center;
    }
    .filters {
      display: flex;
      gap: 16px;
      margin: 8px 0 10px;
      border-bottom: 1px solid var(--line);
    }
    .filters span {
      position: relative;
      padding: 7px 0 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .filters span em { margin-left: 4px; color: var(--faint); font-style: normal; }
    .filters .on { color: var(--text); }
    .filters .on::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 1.5px;
      border-radius: 2px;
      background: var(--text);
    }
    .project {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .04em;
      margin: 2px 0 8px;
    }
    .chevron {
      width: 8px;
      height: 8px;
      margin-right: 2px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg);
      opacity: .55;
    }
    .sessions { display: grid; align-content: start; gap: 8px; }
    .session {
      display: flex;
      min-width: 0;
      overflow: hidden;
      border: 1px solid transparent;
      border-radius: 12px;
      background: var(--card);
    }
    .session.unread {
      border-color: rgba(224, 162, 87, .28);
      background: rgba(224, 162, 87, .08);
    }
    .rail { width: 3px; flex: 0 0 auto; }
    .rail.working { background: var(--working); }
    .rail.wait { background: var(--wait); }
    .content { min-width: 0; flex: 1; padding: 9px 10px 8px 12px; }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 13px;
    }
    .heading { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
    .heading strong { font-weight: 650; }
    .idx { color: var(--faint); font-size: 11px; font-weight: 650; letter-spacing: .04em; }
    .chip {
      padding: 2px 7px;
      border-radius: 99px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    .chip.working { color: #102418; background: var(--working); }
    .chip.wait { color: #2a1b07; background: var(--wait); }
    .actions { display: flex; gap: 10px; margin-top: 5px; }
    .actions span { color: var(--muted); font-size: 10px; }
    .jump {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      align-self: center;
      margin: 0 10px 0 0;
      border: 1px solid var(--line);
      border-radius: 99px;
      color: var(--text);
      background: rgba(0, 0, 0, .18);
    }
    .jump.dim { opacity: .6; color: var(--muted); }
    footer {
      display: flex;
      justify-content: flex-end;
      gap: 14px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
    }
    footer .danger { color: #e89b9b; }
    .dock-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2px;
      margin: 8px -6px 0;
      padding: 6px 4px 2px;
      border-top: 1px solid var(--line);
    }
    .dock-nav span {
      display: grid;
      justify-items: center;
      gap: 4px;
      padding: 6px 2px 4px;
      border-radius: 10px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .08em;
    }
    .dock-nav span::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 99px;
      background: transparent;
    }
    .dock-nav .on { color: var(--text); }
    .dock-nav .on::before { background: var(--working); }
  </style>
</head>
<body data-scene="__SCENE__">
  <div class="stage">
    <div class="orb-slot">
      <div class="orb-wrap">
        <div class="ball-shell">
          <div class="ball __BALL__" style="--ratio:.4">
            <span class="ball-core"></span>
            <span class="ball-ring"></span>
            <span class="count">
              <span class="count-work">2</span>
              <span class="count-total">5</span>
            </span>
          </div>
          <span class="badge">?</span>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="hero">
        <div class="hero-count">
          <span class="hero-work">2</span>
          <div class="hero-rest">
            <span class="hero-track">/ 5</span>
            <span class="hero-meta">需要你</span>
          </div>
        </div>
        <div class="icon-button">×</div>
      </div>
      <div class="filters">
        <span class="on">全部 <em>5</em></span>
        <span>工作中 <em>2</em></span>
        <span>未工作 <em>3</em></span>
      </div>
      <div class="panel-body">
        <div class="project">OrbCue <i class="chevron"></i></div>
        <div class="sessions">
          <div class="session unread">
            <div class="rail wait"></div>
            <div class="content">
              <div class="topline">
                <span class="heading"><strong>Grok</strong><span class="idx">01</span></span>
                <span class="chip wait">等待输入</span>
              </div>
              <div class="actions"><span>已读</span><span>清除</span></div>
            </div>
            <div class="jump">
              <svg viewBox="0 0 16 16" width="15" height="15">
                <path d="M5.5 4.5 2 8l3.5 3.5M2.5 8H9a4 4 0 0 0 4-4V3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>
          </div>
          <div class="session">
            <div class="rail working"></div>
            <div class="content">
              <div class="topline">
                <span class="heading"><strong>Claude</strong><span class="idx">01</span></span>
                <span class="chip working">工作中</span>
              </div>
              <div class="actions"><span>清除</span></div>
            </div>
            <div class="jump dim">
              <svg viewBox="0 0 16 16" width="15" height="15">
                <path d="M5.5 4.5 2 8l3.5 3.5M2.5 8H9a4 4 0 0 0 4-4V3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>
          </div>
        </div>
      </div>
      <footer>
        <span>全部已读</span>
        <span class="danger">清除全部</span>
      </footer>
      <nav class="dock-nav">
        <span class="on">动态</span>
        <span>审计</span>
        <span>连接</span>
        <span>设置</span>
      </nav>
    </div>
  </div>
</body>
</html>
