[package]
name = "orbcue"
version.workspace = true
description = "The orb that cues you when an agent needs you"
authors = ["OrbCue contributors"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "orbcue_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
orbcue-core = { path = "../crates/dock-core" }
orbcue-ipc = { path = "../crates/dock-ipc" }
orbcue-connect = { path = "../crates/dock-connect" }
orbcue-service = { path = "../crates/dock-service" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
tauri-winrt-notification = "0.7"
windows-registry = "0.5"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
] }
