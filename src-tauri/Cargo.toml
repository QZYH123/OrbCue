[package]
name = "agent-activity-dock"
version.workspace = true
description = "A calm local attention layer for Agent sessions"
authors = ["Agent Activity Dock contributors"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "agent_activity_dock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-activity-dock-core = { path = "../crates/dock-core" }
agent-activity-dock-ipc = { path = "../crates/dock-ipc" }
agent-activity-dock-connect = { path = "../crates/dock-connect" }
agent-activity-dock-service = { path = "../crates/dock-service" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
