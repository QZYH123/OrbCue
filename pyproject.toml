[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-activity-dock"
version = "0.1.0"
description = "Local event-driven status ball for background Agents"
requires-python = ">=3.12"
readme = "README.md"

[project.scripts]
dock = "agent_activity_dock.cli:main"
agent-activity-dock-daemon = "agent_activity_dock.daemon:main"
agent-activity-dock-ball = "agent_activity_dock.ball:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
