[package]
name = "orbcue-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "orb"
path = "src/main.rs"

[dependencies]
orbcue-adapters = { path = "../dock-adapters" }
orbcue-connect = { path = "../dock-connect" }
orbcue-core = { path = "../dock-core" }
orbcue-ipc = { path = "../dock-ipc" }
orbcue-service = { path = "../dock-service" }
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
time.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
